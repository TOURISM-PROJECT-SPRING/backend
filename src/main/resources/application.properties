spring.application.name=spring_boot_project_api

# database connection detail
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
# spring.datasource.password=tourism
# spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# redis detail
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Custom path for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path for raw OpenAPI JSON documentation
springdoc.api-docs.path=/api-docs

# Sort endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# port for spring boot
server.port=${SERVER_PORT:8080}

# multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB