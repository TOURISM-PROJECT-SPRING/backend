spring.application.name=spring_boot_project_api

# database connection detail
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tourism_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# redis detail
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Custom path for Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path for raw OpenAPI JSON documentation
springdoc.api-docs.path=/api-docs

# Sort endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# port for spring boot
server.port=${SERVER_PORT:8080}

# multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# JWT
jwt.secret=${JWT_SECRET:dev-only-change-me-please-super-secret-key-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# password reset token lifetime
auth.reset-token-expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:30}
bakong.api.token=${BAKONG_API_TOKEN:}

# Google Gemini AI Configuration
gemini.api.key=${GERMINI_API_KEY:${GEMINI_API_KEY:}}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=30