# Application
spring.application.name=spring_boot_project_api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tourism_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Railway HTTP Port
server.port=${PORT:8080}
server.address=0.0.0.0

# Hibernate (temporary demo database only)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# JWT - No default secret in production
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Gemini
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.timeout-seconds=30

# Social login (Google / GitHub). Endpoints have sensible defaults; set
# the Google OAuth client id as the audience to reject tokens issued for other apps.
social.google.token-info-url=${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
social.google.audience=${GOOGLE_CLIENT_ID:}