spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis is optional for the app context test (no eager connection)
spring.data.redis.host=localhost
spring.data.redis.port=6379


# Cloudinary placeholders. Tests never use the live account.
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# JWT
jwt.secret=dev-only-change-me-please-super-secret-key-2026
jwt.expiration-ms=86400000

# password reset token lifetime
auth.reset-token-expiration-minutes=30
