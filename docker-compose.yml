services:
  postgres:
    image: postgres:17
    container_name: tourism-postgres

    environment:
      POSTGRES_DB: tourism_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tourism

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tourism-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: tourism@admin.com
      PGADMIN_DEFAULT_PASSWORD: tourism

    ports:
      - "5050:80"

    depends_on:
      - postgres

  app:
    build: .
    container_name: tourism-app

    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
