services:
  postgres:
    image: postgres:17
    container_name: tourism-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tourism-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: tourism@admin.com
      PGADMIN_DEFAULT_PASSWORD: tourism

    ports:
      - "5050:80"

    depends_on:
      - postgres

  app:
    build: .
    container_name: tourism-app

    ports:
      - "8080:8080"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

  redis_data: